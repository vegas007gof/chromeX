<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>ChromeX — настройки</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; color: #202124; }
    h1 { font-size: 18px; margin: 0 0 16px; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    textarea { width: 100%; height: 220px; font-family: inherit; font-size: 13px; padding: 8px; box-sizing: border-box; }
    input[type="range"] { width: 100%; }
    .row { margin: 16px 0; }
    button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Настройки фильтра</h1>

  <div class="row">
    <label for="threshold">Порог блокировки: <span id="thresholdVal">0.72</span></label>
    <input type="range" id="threshold" min="0.5" max="0.95" step="0.01" value="0.72" />
  </div>

  <label for="forbidden">Запрещённые темы (одна на строку)</label>
  <textarea id="forbidden" placeholder="азартные игры&#10;онлайн казино"></textarea>

  <div class="row">
    <button id="save">Сохранить</button>
    <button id="reload">Обновить с диска</button>
  </div>

  <p id="status" style="color:#188038;font-size:13px"></p>
  <p style="font-size:12px;color:#5f6368">
    Модель хранится локально в <code>models/</code> и не обновляется автоматически.
  </p>

  <script src="settings.js"></script>
</body>
</html>
