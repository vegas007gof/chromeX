<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Настройки</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    textarea { width: 100%; height: 240px; box-sizing: border-box; font-size: 13px; }
    input[type="range"] { width: 100%; }
    button { margin-top: 16px; padding: 8px 20px; cursor: pointer; }
    #msg { color: #188038; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>Фильтр ChromeX</h2>
  <label>Порог: <span id="tv">0.72</span></label>
  <input type="range" id="th" min="0.5" max="0.95" step="0.01" />
  <label>Запрещённые темы</label>
  <textarea id="fb"></textarea>
  <button id="save">Сохранить</button>
  <p id="msg"></p>
  <script>
    const th = document.getElementById("th");
    const tv = document.getElementById("tv");
    const fb = document.getElementById("fb");
    th.oninput = () => (tv.textContent = Number(th.value).toFixed(2));

    async function load() {
      const d = await pywebview.api.load();
      fb.value = d.forbidden || "";
      th.value = d.threshold ?? 0.72;
      tv.textContent = Number(th.value).toFixed(2);
    }

    document.getElementById("save").onclick = async () => {
      await pywebview.api.save(fb.value, Number(th.value));
      document.getElementById("msg").textContent = "Сохранено";
    };

    load();
  </script>
</body>
</html>
